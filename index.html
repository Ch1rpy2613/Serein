<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070a" />
    <meta
      name="description"
      content="Atmos 触感天气图集：温度、降水、风、湿度、空气、能见度、气压、日照、月相、雷达、台风与白噪音。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atmos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/atmos-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/atmos-icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/atmos-icon-192.png" sizes="192x192" />
    <title>Atmos</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070a;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #atmos-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #05070a;
        color: rgba(255, 255, 255, 0.92);
        pointer-events: none;
      }
      /* 首帧即可见，作为 LCP 候选；勿从 opacity:0 起画 */
      #atmos-boot .atmos-boot-mark {
        margin: 0;
        font-family: -apple-system, "SF Pro", Inter, "PingFang SC", sans-serif;
        font-size: clamp(28px, 6vw, 40px);
        font-weight: 500;
        letter-spacing: 0.14em;
        opacity: 1;
      }
      @media (prefers-reduced-motion: no-preference) {
        #atmos-boot .atmos-boot-mark {
          animation: atmos-boot-breath 1.2s ease-in-out 1;
        }
      }
      @keyframes atmos-boot-breath {
        0% {
          opacity: 0.85;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="atmos-boot" aria-hidden="true">
      <p class="atmos-boot-mark">Atmos</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
