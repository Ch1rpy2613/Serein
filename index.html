<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a121c" />
    <meta
      name="description"
      content="Serein 触感天气图集：温度、降水、风、湿度、空气、能见度、气压、日照、月相、雷达、台风与白噪音。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Serein" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/serein-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/serein-icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/serein-icon-192.png" sizes="192x192" />
    <title>Serein</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a121c;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #serein-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 80% 55% at 50% 38%, rgba(168, 212, 232, 0.14), transparent 62%),
          radial-gradient(ellipse 100% 80% at 50% 100%, rgba(10, 18, 28, 0.9), transparent 55%),
          linear-gradient(165deg, #0e1a28 0%, #0a121c 48%, #060d14 100%);
        color: rgba(236, 242, 248, 0.94);
        pointer-events: none;
      }
      #serein-boot .serein-boot-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #serein-boot .serein-boot-mark {
        width: min(72px, 18vw);
        height: min(72px, 18vw);
        margin: 0;
        border-radius: 22%;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      #serein-boot .serein-boot-word {
        margin: 0;
        font-family: Fraunces, 'Songti SC', Georgia, serif;
        font-size: clamp(26px, 5.5vw, 36px);
        font-weight: 500;
        letter-spacing: 0.08em;
      }
      @media (prefers-reduced-motion: no-preference) {
        #serein-boot .serein-boot-stack {
          animation: serein-boot-rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
      }
      @keyframes serein-boot-rise {
        0% {
          opacity: 0.55;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="serein-boot" aria-hidden="true">
      <div class="serein-boot-stack">
        <img class="serein-boot-mark" src="/serein-icon.svg" width="72" height="72" alt="" />
        <p class="serein-boot-word">Serein</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
